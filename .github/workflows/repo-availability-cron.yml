name: Repository Availability Cron

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  repo-availability:
    name: Read-only repository availability checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only availability checks
        run: |
          python3 tools/compat_l2_reporter.py cron \
            --json-output repo-availability-report.json \
            --markdown-output repo-availability-report.md \
            --fail-on-unavailable

      - name: Upload availability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-availability-report
          path: |
            repo-availability-report.json
            repo-availability-report.md
          if-no-files-found: ignore
