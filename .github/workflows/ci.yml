name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate runtime and packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck logrotate systemd
          sudo apt-get install -y shfmt || true

      - name: Python compile
        run: python3 -m compileall -q tui tests/unit/test_tui_modules.py

      - name: Bash syntax
        run: bash tests/syntax.sh

      - name: Unit behavior tests
        run: bash tests/unit.sh

      - name: Systemd unit verification
        run: |
          if ! getent passwd watchdogvpn >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin watchdogvpn
          fi
          sudo install -m 0755 -d /usr/local/bin /usr/local/sbin /etc/logrotate.d /var/log/myvpn
          sudo install -m 0755 /bin/true /usr/local/bin/watchdogvpn-daemon
          sudo install -m 0755 /bin/true /usr/local/bin/vpn_rp_filter_boot
          # CI-only stubs so systemd-analyze verify can resolve the NM/TUN
          # wrapper paths referenced by the watchdogvpn-nm-*.service units.
          # These are throwaway placeholders for verification only; the real
          # wrappers are installed by lib/runtime.sh at install/update time.
          sudo install -m 0755 /bin/true /usr/local/bin/watchdogvpn-nm-dns-restore
          sudo install -m 0755 /bin/true /usr/local/bin/watchdogvpn-nm-tun-cleanup
          sudo install -m 0755 /bin/true /usr/local/bin/watchdogvpn-nm-tun-register
          sudo install -m 0700 sbin/vpn_domain_bypass_apply.sh /usr/local/sbin/vpn_domain_bypass_apply.sh
          sudo install -m 0644 etc/logrotate.d/myvpn /etc/logrotate.d/myvpn
          sudo systemd-analyze verify systemd/*.service systemd/*.timer 2>&1 | tee /tmp/watchdogvpn-systemd-verify.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: ShellCheck advisory
        run: |
          set +e
          find . \
            -path ./.git -prune -o \
            -type f \( -name '*.sh' -o -path './bin/*' -o -path './sbin/*' -o -path './networkmanager/dispatcher.d/*' \) \
            -print0 | xargs -0 shellcheck -x
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "ShellCheck advisory found issues. This is non-blocking while shell hardening is in progress."
            echo "ShellCheck cleanup is tracked for the v0.2/v1.0 hardening path."
          fi
          exit 0

      - name: shfmt advisory
        run: |
          command -v shfmt >/dev/null || { echo "shfmt not available on this runner"; exit 0; }
          set +e
          find . \
            -path ./.git -prune -o \
            -type f \( -name '*.sh' -o -path './bin/*' -o -path './sbin/*' -o -path './networkmanager/dispatcher.d/*' \) \
            -print0 | xargs -0 shfmt -d
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "shfmt advisory found formatting diffs. This is non-blocking while shell hardening is in progress."
            echo "Formatting cleanup is tracked for the v0.2/v1.0 hardening path."
          fi
          exit 0
