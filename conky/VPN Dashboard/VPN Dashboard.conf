background yes
double_buffer yes
no_buffers yes

alignment top_right
gap_x 2110
gap_y 198

border_width 1
cpu_avg_samples 2
default_color E8EDF2
default_outline_color E8EDF2
default_shade_color E8EDF2
draw_borders no
draw_graph_borders no
draw_outline no
draw_shades no

minimum_size 258 0
maximum_width 245
net_avg_samples 2
out_to_console no
out_to_stderr no
extra_newline no

own_window yes
own_window_type desktop
own_window_transparent yes
own_window_colour 000000
own_window_argb_visual yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager

show_graph_scale no
show_graph_range no
stippled_borders 0
update_interval 2
uppercase no
use_spacer none

use_xft yes
override_utf8_locale yes
xftalpha 1
xftfont Ubuntu:size=10
color0 7AA2F7
color1 E8EDF2
color2 9ECE6A
color3 F7768E
color4 E0AF68
color5 7DCFFF
color6 C0CAF5

TEXT
${color0}${font Ubuntu:bold:size=12}VPN${font}${alignr}${color6}${font Ubuntu:size=9}live${font}
${color0}${hr 2}

${voffset 7}${color0}${font Ubuntu:bold:size=10}CORE${font}
${color6}VPN${goto 84}${execi 4 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh vpn}
${color6}Tun${goto 84}${execi 4 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh tun}
${color6}Loc${goto 84}${execi 4 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh location}
${color6}Age${goto 84}${execi 4 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh age}

${voffset 7}${color0}${font Ubuntu:bold:size=10}NETWORK${font}
${color6}Route${goto 84}${execi 4 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh route}
${color6}IP${goto 84}${execi 10 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh ip}
${color6}Country${goto 84}${execi 12 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh country}
${color6}Bypass${goto 84}${execi 15 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh bypass}

${voffset 7}${color0}${font Ubuntu:bold:size=10}AUTO${font}
${color6}Rotate${goto 84}${execi 6 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh rotate}
${color6}Next${goto 84}${execi 2 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh next_rotate}
${color6}Watch${goto 84}${execi 6 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh watchdog}
${color6}Event${goto 84}${execi 6 ~/.conky/VPN\ Dashboard/vpn_dashboard_data.sh event}
