# Managed by WatchdogVPN.
#
# Required for AmneziaWG (and any other fwmark-based default-route policy
# routing this project uses): without it, strict reverse-path filtering
# drops return traffic whose source address does not match the interface
# it arrived on. This mirrors what wg-quick/awg-quick set for a default
# route tunnel.
#
# Both keys are required, not just "all": conf.all is combined with the
# specific interface's own value (kernel docs: "src_valid_mark must be set
# on the source interface too"), and conf.default is only the template a
# newly created interface inherits at creation time - it does not affect
# interfaces that already exist. The AmneziaWG interface is deleted and
# recreated on every connect, so it always inherits conf.default fresh;
# setting only conf.all here would not reliably reach it.
#
# This is applied once at install/update time, as root, outside the
# watchdogvpn daemon's systemd sandbox, and via /etc/sysctl.d/ so it is also
# reapplied by systemd-sysctl.service on every boot. The daemon runs under
# ProtectKernelTunables=true, which makes /proc/sys read-only for it, so it
# cannot and does not attempt to set this itself at connect time - it only
# verifies the interface's own value once the interface exists.
net.ipv4.conf.all.src_valid_mark = 1
net.ipv4.conf.default.src_valid_mark = 1

# src_valid_mark alone does not fully cover strict reverse-path filtering
# for this policy-routing setup, found live on a Rocky Linux 9
# certification VM (Task 23.6.5b): the "table main suppress_prefixlength 0"
# rule (drivers/amneziawg_driver.py::_configure_routes) hides the main
# table's default route from the *physical* interface's own reverse-path
# check for the AmneziaWG server's address, so that check resolves via the
# tunnel device instead of the interface the server's real, unmarked
# response packets physically arrive on. Strict mode (1) then silently
# drops them - the connection looks healthy (real process, real interface,
# handshake retries sent) but never receives a single byte back. Loose mode
# (2, RFC3704) keeps real anti-spoofing value while tolerating this
# asymmetry, unlike fully disabling (0).
#
# This alone does not reach an existing physical interface: conf.default
# only templates interfaces created after this file is applied, and on a
# typical machine the primary NIC is already created by the kernel driver
# before systemd-sysctl.service ever runs - confirmed live on Rocky Linux 9
# (Task 23.6.5b), where a full reboot still left the physical interface
# strict even with this file in place. lib/runtime.sh's
# install_sysctl_defaults() additionally detects the current default-route
# interface and sets its rp_filter directly on every install/update run,
# which is what actually makes this self-healing in the common case.
# drivers/amneziawg_driver.py::_ensure_rp_filter() remains the connect-time
# safety net for the remaining case: the default interface changed since
# the last install/update ran.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
